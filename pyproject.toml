[tool.pyright]
typeCheckingMode = "standard"

[project]
name = "nano-vllm"
version = "0.1.0"
description = "A tiny LLM inference server built from scratch — implementing inference papers and primitives in minimal readable code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
]
