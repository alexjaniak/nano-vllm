[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
# Keep linting and formatting consistent with Ruff's default/Black-compatible
# width. Ruff uses this as a wrapping target; it is not a hard guarantee for
# comments and long strings.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruff's safe default rule set, made explicit for editor/CI consistency.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# A trailing comma preserves an intentionally stacked/multiline signature.
skip-magic-trailing-comma = false

[project]
name = "nano-vllm"
version = "0.1.0"
description = "A tiny LLM inference server built from scratch — implementing inference papers and primitives in minimal readable code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
]
